<h3 class="text-center">Adatfelvitel</h3>

<hr>


<!--Űrlap-->
<div class="row">
    <div class="form-floating mb-3 col-12 col-lg-6">
      <input type="date" class="form-control" id="dateField" placeholder="">
      <label for="dateField">Dátum</label>
    </div>
    <div class="form-floating mb-3 col-12 col-lg-6" >
        <input type="text" class="form-control" id="typeField" placeholder="">
        <label for="typeField">Időjárás típusa</label>
    </div>
    <div class="form-floating mb-3 col-12 col-lg-6" >
      <input type="number" class="form-control" id="minField" placeholder="">
      <label for="minField">Minimum hőmérséklet</label>
    </div>
    <div class="form-floating mb-3 col-12 col-lg-6" >
        <input type="number" class="form-control" id="maxField" placeholder="">
        <label for="maxField">Maximum hőmérséklet</label>
    </div>
    <hr>
    
    <div class="col-12 col-lg-4 mb-3">
      <button type="button" class="btn btn-success" id="addBTN" onclick="addData()">Hozzáadás</button>
      <button type="button" class="btn btn-warning d-none" id="updateBTN" onclick="update()">Módosítás</button>
      <button type="button" class="btn btn-danger d-none" id="delBTN" onclick="delF()">Törlés</button>
      <button type="button" class="btn btn-secondary d-none" id="cancelBTN" onclick="cancel()">Mégsem</button>
    </div>
    
  </div>


<!--Felvett táblázat-->
<table class="table">
    <thead>
      <tr>
        <th class="text-center">#</th>
        <th class="text-start">Dátum</th>
        <th class="text-end ">Minimum</th>
        <th class="text-end">Maximum</th>
        <th class="text-end">Típusa</th>
      </tr>
    </thead>
    <tbody id="Tablazat">

        <!--Ide jöhet a tartalom dinamikusan-->
    </tbody>
  </table>

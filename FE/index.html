<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Időjárás előrejezlő applikáció</title>
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <title>Időjárás előrejelző app</title>
</head>
<body>
    <div class="container">

        <header>
            <h1>Időjárás előrejelző app</h1>
            <span id="themeSwitch">
              <i class="bi bi-sun-fill" id="lightModeBTN"></i>
              <i class="bi bi-moon-fill hide" id="darkModeBTN"></i>
            </span>
        </header>

        <hr>
        <nav class="navbar navbar-expand-lg mt-3">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Menü</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav" id="mainMenu">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" onclick="render('login')">Bejelentkezés</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" onclick="render('register')">Regisztráció</a>
                  </li>
                </ul>
                <ul class="navbar-nav hide" id="userMenu">
                  <li class="nav-item">
                    <a class="nav-link" aria-current="page" onclick="render('main')">Időjárás előrejelző</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" onclick="render('statistics')">Statisztika</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" onclick="render('calendar')">Naptár</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" onclick="render('profile')">Profilom</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" onclick="userLogout()">Kijelentkezés</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>

          <div id="alertBox" class="alert hide alert-dismissible fade show" role="alert">
            <h5 id="alertTitle" class="fw-bold"></h5>
            <span id="alertMessage"></span>
            <button type="button" class="btn-close" aria-label="Close" onclick="alertH()"></button>
          </div>
          <hr>
        <main id="FoMain">
            <!--Dinamikus feltöltés lenne-->
        </main>
        <hr>
        <footer class="text-end me-5">
            <p class="fs-2"> Bajai SZC Türr István Technikum</p>
            <p class="fs-3"> Rék Dávid</p>
            <p class="fs-4"> 2025</p>
        </footer>
    </div>
    <!--Assets-->
    <script src="./assets/js/bootstrap.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js'></script>
    <script src="https://canvasjs.com/assets/script/jquery-1.11.1.min.js"></script>
    <script src="https://cdn.canvasjs.com/jquery.canvasjs.min.js"></script>
    <script src="./assets/js/app.js"></script>
    <!--Controllers-->
    <script src="./controllers/alertCTRL.js"></script>
    <script src="./controllers/usersCTRL.js"></script>
    <script src="./controllers/weatherCTRL.js"></script>
    <script src="./controllers/calendar.js"></script>
    <script src="./controllers/canvasCTRL.js"></script>
</body>
</html>
